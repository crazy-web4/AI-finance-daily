  filtering:
    url_dedup: true
    title_dedup: true
    title_similarity_threshold: 0.85
    min_content_length: 100
    max_age_hours: 48
  source_priority:
    tier_sources:
      tier1:
      - openai.com
      - anthropic.com
      - deepmind.google
      - meta.ai
      - nvidia.com
      - arxiv.org
      - gov
      - gov.cn
      - sec.gov
      tier2:
