    name: 政策与监管搜索
    description: 全球AI监管政策动态
    enabled: true
    strategy: list
    max_results: 10
    depth: basic
    priority_domains:
    - gov
    - gov.cn
    - gov.uk
    - gov.au
    - europa.eu
    - cac.gov.cn
    - cftc.gov
    - sec.gov
