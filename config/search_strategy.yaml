      - bloomberg.com
      - ft.com
      - wsj.com
      - nature.com
      - science.org
      - technologyreview.com
      tier3:
      - techcrunch.com
      - theverge.com
      - wired.com
      - arstechnica.com
      - venturebeat.com
    tier_weights:
      tier1: 100
      tier2: 80
      tier3: 60
